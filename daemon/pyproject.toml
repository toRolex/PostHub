[project]
name = "posthub-daemon"
version = "0.1.6"
description = "PostHub Python 依赖薄层：仅保留官方后端依赖可用的 conf 配置"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "social-auto-upload",
    # 官方 sau_backend.py（Flask 主入口）import 依赖；上游 web extra 中声明，
    # 主依赖不含，PostHub 显式补齐（版本对齐上游 pyproject web extra）
    "Flask[async]==3.1.1",
    "flask-cors==6.0.0",
    # 官方 myUtils/auth.py 顶层 `from playwright.async_api import async_playwright`
    # 需要 playwright 顶层模块；上游主依赖已换 patchright 但源码仍 import playwright 名。
    # 按官方 requirements.txt 版本补齐（版本对齐上游 requirements.txt）。
    "playwright==1.52.0",
    # 官方 myUtils/auth.py 顶层 `from xhs import XhsClient`（小红书 client）。
    # 上游 requirements.txt 声明但主依赖缺失，PostHub 显式补齐。
    "xhs==0.2.13",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.uv.sources]
social-auto-upload = { git = "https://github.com/dreammis/social-auto-upload.git" }

[[tool.uv.index]]
url = "http://mirrors.aliyun.com/pypi/simple/"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
