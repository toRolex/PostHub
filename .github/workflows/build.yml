name: build-desktop

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            artifact: posthub-macos
          - platform: windows-latest
            artifact: posthub-windows
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install frontend dependencies
        run: pnpm --dir web install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Stage daemon resources + platform uv
        run: python3 scripts/prepare_resources.py

      - name: Daemon smoke test
        shell: bash
        run: |
          cd src-tauri/resources/daemon
          UV_BIN="$(ls ../bin/uv-* | head -1)"
          UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/posthub-smoke-venv" "$UV_BIN" sync
          UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/posthub-smoke-venv" "$UV_BIN" run --project . python run_backend.py &
          sleep 15
          curl -fsS --retry 5 http://127.0.0.1:5409/getFiles
          kill %1 2>/dev/null || true

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@v2

      - name: Cache Tauri bundle tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/tauri
            $LOCALAPPDATA/tauri
          key: ${{ runner.os }}-tauri-bundle-tools

      - name: Build desktop app
        run: tauri build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
