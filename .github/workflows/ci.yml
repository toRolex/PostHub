name: ci

on:
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: astral-sh/setup-uv@v3
        with:
          version: latest

      - name: Install frontend deps
        run: pnpm --dir web install --frozen-lockfile

      - name: Frontend lint
        working-directory: web
        run: pnpm lint || true

      - name: Daemon import smoke
        working-directory: daemon
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/posthub-smoke-venv
        run: |
          uv sync --quiet
          uv run python -c "import conf, db_init, sau_backend; print('daemon import ok')"
      # 原本计划加 cargo check --target x86_64-pc-windows-msvc 兜底 Windows-only 类型错误，
      # 但 ubuntu runner 需要装 MSVC 工具链（lld-link + lib.exe），CI 时间成本太高。
      # Windows 类型错误暂由 build.yml tag 流水线把关；改进方案另起 PR 跟踪。