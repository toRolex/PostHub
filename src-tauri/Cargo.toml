[package]
name = "posthub"
version = "0.1.4"
description = "PostHub 发布中枢 — 三平台短视频自动发布工具"
authors = ["PostHub Contributors"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "posthub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2" }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["tls"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
